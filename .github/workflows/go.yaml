name: E2E Tests

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Install Flux CLI
        uses: fluxcd/flux2/action@22c6ee1a6099ce252b729199c105a38319b587d4 # main

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: task generate
        run: |
          task generate --verbose

      - name: task validate
        run: task validate --verbose

        # ubuntu-26.04 no longer applies the image's /etc/sysctl.conf, so kind's inotify limits fall back to defaults.
      - name: Raise inotify limits for kind
        run: |
          sudo sysctl -w fs.inotify.max_user_instances=1280
          sudo sysctl -w fs.inotify.max_user_watches=655360

      - name: Running Test e2e
        run: task test-e2e